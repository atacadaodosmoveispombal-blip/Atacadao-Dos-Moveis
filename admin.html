<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ADM · Atacarejo dos Móveis</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="admin.css?v=banner-library-4">
  <script defer src="assets/supabase-2.116.0.js"></script>
  <script defer src="admin-app.js?v=banner-library-4"></script>
</head>
<body>
  <section id="login" class="login card" aria-labelledby="loginTitle">
    <img src="assets/logo.png" alt="Atacarejo dos Móveis">
    <h1 id="loginTitle">Painel Administrativo</h1>
    <p>Entre para administrar a loja.</p>
    <form id="loginForm" onsubmit="event.preventDefault()" aria-busy="true">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="Seu e-mail" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Sua senha" required>
      <button id="loginSubmit" type="submit" disabled>Preparando acesso…</button>
    </form>
    <div id="error" class="error" role="status" aria-live="polite"></div>
    <noscript><p>Ative o JavaScript do navegador para entrar no painel.</p></noscript>
  </section>
  <div id="app" class="shell" hidden>
    <aside id="sidebar" aria-label="Menu administrativo">
      <div class="brand">
        <img src="assets/logo.png" alt="Atacarejo dos Móveis">
        <button id="closeMenu" type="button" aria-label="Fechar menu">×</button>
      </div>
      <nav aria-label="Módulos do painel">
        <b>DASHBOARD</b><button data-view="dashboard" class="active">⌂ Visão geral</button>
        <b>CATÁLOGO</b>
        <button data-view="products">▦ Produtos</button>
        <button data-view="categories">◫ Categorias</button>
        <button data-view="environments">⌂ Ambientes</button>
        <button data-view="brands">◇ Marcas</button>
        <button data-view="stock">▤ Estoque</button>
        <button data-view="promotions">% Promoções</button>
        <button data-view="coupons">◇ Cupons</button>
        <b>CONTEÚDO</b>
        <button data-view="banners">▣ Campanhas e banners</button>
        <button data-view="sections">☷ Página inicial</button>
        <button data-view="inspirations">◎ Inspirações</button>
        <b>ATENDIMENTO</b><button data-view="leads">✉ Leads / Orçamentos</button>
        <button data-view="store">⌖ Loja e WhatsApp</button>
        <b>ADMINISTRAÇÃO</b>
        <button data-view="seo">⌕ SEO</button>
        <button data-view="users">♙ Usuários ADM</button>
        <button data-view="settings">⚙ Configurações</button>
        <button data-view="audit">☷ Auditoria</button>
      </nav>
      <footer><span id="who"></span><button id="logout" type="button">Sair</button></footer>
    </aside>
    <button id="menuBackdrop" type="button" aria-label="Fechar menu" tabindex="-1"></button>
    <main>
      <header class="admin-topbar">
        <button id="openMenu" class="topbar-menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">☰</button>
        <label class="panel-search" for="panelSearch"><span aria-hidden="true">⌕</span><input id="panelSearch" type="search" autocomplete="off" placeholder="Buscar no painel..."></label>
        <div class="topbar-actions">
          <a class="view-site" href="index.html" target="_blank" rel="noopener">Ver site <span aria-hidden="true">↗</span></a>
          <button id="refresh" type="button" aria-label="Atualizar dados" title="Atualizar dados">↻</button>
          <span class="topbar-avatar" id="profileInitials" aria-hidden="true">AD</span>
          <span id="whoTop" class="topbar-user">Administrador</span>
        </div>
      </header>
      <section class="page-context" aria-labelledby="pageTitle">
        <div class="breadcrumbs"><span id="breadcrumbRoot">Atacarejo dos Móveis</span><b aria-hidden="true">›</b><strong id="breadcrumbTitle">Visão geral</strong></div>
        <div class="page-heading-row">
          <div class="page-heading"><span class="page-icon" id="pageIcon" aria-hidden="true">⌂</span><div><div class="page-title-line"><h1 id="pageTitle" tabindex="-1">Visão geral</h1><span id="pageBadge" class="page-badge" hidden></span></div><p id="pageSubtitle">Acompanhe o desempenho da sua loja em tempo real.</p></div></div>
          <button id="pageAction" class="primary-action page-action" type="button" hidden></button>
        </div>
      </section>
      <div id="content"></div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="editorDialog" aria-labelledby="dialogTitle">
    <form id="editorForm">
      <header><div><small id="dialogEyebrow">CADASTRO</small><h2 id="dialogTitle">Editar</h2></div><button type="button" class="icon-close" data-close aria-label="Fechar">×</button></header>
      <div id="editorFields" class="form-grid"></div>
      <footer><span class="editor-footer-spacer"></span><button type="button" class="secondary" data-close>Cancelar</button><button id="saveDraftCategory" type="button" class="secondary" hidden>Salvar rascunho</button><button id="viewBannerSite" type="button" class="secondary" hidden>Visualizar no site</button><button id="saveEditor" type="submit">Salvar alterações</button></footer>
    </form>
  </dialog>
</body>
</html>
