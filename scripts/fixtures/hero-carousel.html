<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../styles.css">
  <title>Teste da Hero</title>
</head>
<body>
  <section class="hero"><div class="hero-art hero-carousel" data-autoplay-ms="120">
    <div class="hero-slides" aria-live="off">
      <figure class="hero-slide is-active" data-hero-slide><img src="../../assets/editorial-room-clean.png" alt="Slide inicial"></figure>
      <figure class="hero-slide" data-hero-slide aria-hidden="true"><img src="../../assets/reference-home.png" alt="Segundo slide"></figure>
    </div>
    <button class="hero-arrow hero-prev" type="button">‹</button>
    <button class="hero-arrow hero-next" type="button">›</button>
    <div class="hero-dots"><button type="button"></button><button type="button"></button></div>
  </div></section>
  <script src="../../hero-carousel.js"></script>
</body>
</html>
