<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#023497">
  <title>Sem conexão · Atacarejo dos Móveis</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <style>
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:#f3f7fc;color:#12386e;font:16px Arial,sans-serif}.offline-card{width:min(430px,100%);padding:30px 24px;border:1px solid #d5e2f0;border-radius:18px;background:#fff;text-align:center;box-shadow:0 16px 45px rgba(4,42,94,.1)}img{display:block;width:128px;height:128px;margin:0 auto 18px;border-radius:24px}h1{margin:0;font-size:1.55rem}p{margin:12px 0 22px;color:#5f7591;line-height:1.55}button{min-height:48px;padding:0 20px;border:0;border-radius:9px;background:#ffda18;color:#07377f;font:800 .9rem Arial,sans-serif;cursor:pointer}button:active{transform:scale(.98)}
  </style>
</head>
<body>
  <main class="offline-card">
    <img src="/assets/pwa-icon-192.png" alt="">
    <h1>Você está sem conexão</h1>
    <p>Produtos, preços e disponibilidade são atualizados online. Reconecte-se para ver as informações atuais da loja.</p>

  </main>
