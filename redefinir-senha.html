<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Redefinir senha | Atacarejo dos Móveis</title>
  <link rel="icon" href="assets/logo-atacarejo.jpeg">
  <link rel="stylesheet" href="styles.css?v=8">
  <link rel="stylesheet" href="customer-account.css?v=1">
</head>
<body>
  <main class="account-reset-page">
    <a class="account-reset-logo" href="/" aria-label="Voltar para a loja">
      <img src="assets/logo-atacarejo.jpeg" alt="Atacarejo dos Móveis">
    </a>
    <section class="account-reset-card" aria-live="polite">
      <div id="resetPasswordApp">
        <p>Validando seu link de recuperação…</p>
      </div>
    </section>
  </main>
  <style>
    .account-reset-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f6fa}.account-reset-logo{display:block;width:min(240px,68vw);margin:0 auto 20px}.account-reset-logo img{display:block;width:100%;border-radius:12px}.account-reset-card{width:min(520px,100%);padding:clamp(24px,5vw,42px);border:1px solid #dce5ef;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(9,49,105,.13)}.account-reset-card h1{margin:0 0 9px;color:#073f9b;font-size:31px}.account-reset-card p{color:#64748b;line-height:1.55}.account-reset-card form{margin-top:20px}.account-reset-card a{color:#0b4dbb;font-weight:900}.account-reset-card .account-fields{grid-template-columns:1fr}
  </style>
  <script src="assets/supabase-2.116.0.js"></script>
  <script src="reset-password.js?v=1"></script>
</body>
</html>
