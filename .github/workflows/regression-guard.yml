name: Proteção antirregressão

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar commit completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar painel, migrations e build
        run: npm run build

